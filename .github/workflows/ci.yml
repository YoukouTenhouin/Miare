name: ci

on:
  push:
  pull_request:

jobs:
  linux-opensuse:
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/tumbleweed:latest

    steps:
      - name: Install build dependencies
        run: >-
          zypper --non-interactive install --no-recommends
          git cmake gcc-c++ libsodium-devel libzstd-devel

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DMIARE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install providers (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium zstd

      - name: Install providers (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libsodium:x64-windows zstd:x64-windows

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DMIARE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix libsodium);$(brew --prefix zstd)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -DMIARE_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
